name: wake-up-supabase

on:
  schedule:
    - cron: "0 10,11 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      WAKE_UP_URL: ${{ vars.WAKE_UP_URL }}
      WAKE_UP_ANCHOR_DATE: ${{ vars.WAKE_UP_ANCHOR_DATE || '2026-01-01' }}
      WAKE_UP_KEY: ${{ secrets.WAKE_UP_KEY }}
    steps:
      - name: Check New York 6 AM window
        id: ny_time
        run: |
          ny_hour="$(TZ=America/New_York date +%H)"
          if [ "$ny_hour" = "06" ]; then
            echo "is_ny_6am=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_ny_6am=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check 6-day interval
        id: interval
        if: steps.ny_time.outputs.is_ny_6am == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          if ! echo "$WAKE_UP_ANCHOR_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
            echo "Invalid WAKE_UP_ANCHOR_DATE value: $WAKE_UP_ANCHOR_DATE (expected YYYY-MM-DD)"
            exit 1
          fi

          ny_today="$(TZ=America/New_York date +%F)"
          anchor_days=$(( $(date -u -d "$WAKE_UP_ANCHOR_DATE" +%s) / 86400 ))
          today_days=$(( $(date -u -d "$ny_today" +%s) / 86400 ))
          elapsed_days=$((today_days - anchor_days))

          if [ "$elapsed_days" -lt 0 ]; then
            echo "WAKE_UP_ANCHOR_DATE is in the future; skipping automatic wake-up."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [ $((elapsed_days % 6)) -eq 0 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip outside New York 6 AM window
        if: steps.ny_time.outputs.is_ny_6am != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "Skipping run outside 6:00 AM America/New_York."

      - name: Skip outside interval
        if: steps.ny_time.outputs.is_ny_6am == 'true' && steps.interval.outputs.should_run != 'true' && github.event_name != 'workflow_dispatch'
        run: echo "Skipping wake-up run today; next automatic run occurs on the next 6-day boundary."

      - name: Validate wake-up URL
        if: steps.interval.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -z "$WAKE_UP_URL" ]; then
            echo "Missing repository variable WAKE_UP_URL"
            exit 1
          fi

      - name: Wake Supabase
        if: steps.interval.outputs.should_run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          if [ -n "$WAKE_UP_KEY" ]; then
            curl --fail --silent --show-error \
              --retry 3 --retry-all-errors --max-time 20 \
              -H "x-wake-key: $WAKE_UP_KEY" \
              "$WAKE_UP_URL"
          else
            curl --fail --silent --show-error \
              --retry 3 --retry-all-errors --max-time 20 \
              "$WAKE_UP_URL"
          fi
